services:
  - type: web
    name: product-api
    runtime: python
    repo: https://github.com/ianmwenda678/product-api
    plan: free
    pythonVersion: "3.12"
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./product.db
      - key: SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
